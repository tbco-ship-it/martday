name: Build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "10 20 * * *"   # 05:10 KST daily — refresh store data before the morning rush
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2
      - name: Refresh store data (best effort; Korean sites may refuse foreign IPs)
        run: |
          (python scripts/collect_emart.py && python scripts/collect_costco.py && python scripts/collect_homeplus.py && python scripts/collect_lottemart.py && python scripts/normalize.py) || echo "refresh failed; keeping committed data"
          if ! git diff --quiet data/; then
            git config user.name "data-bot" && git config user.email "data-bot@users.noreply.github.com"
            git add data && git commit -m "data: daily store refresh $(date -u +%F)" && git push
          fi
      - run: python scripts/build.py --base / --origin https://martoday.com --cname martoday.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2
      - run: python scripts/build.py
      - run: python scripts/indexnow.py || true
